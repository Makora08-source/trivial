<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trivial Challenge - Modo Desafío</title>
    <link rel="stylesheet" href="style.css">
    <!-- Usamos la SDK modular importada desde script.js (script.js es type=module) -->
</head>
<body>
    <div id="setup-screen">
        <h1>¡Bienvenido al Trivial!</h1>
        <div id="auth-area">
            <p id="auth-status">No autenticado</p>
            <div id="email-auth" style="margin-top:10px;">
                <input type="email" id="email-input" placeholder="Correo electrónico" style="width:200px; margin-right:5px;">
                <input type="password" id="password-input" placeholder="Contraseña" style="width:200px; margin-right:5px;">
            </div>
        </div>
        <div style="margin-top:10px;">
            <button id="start-btn" onclick="empezarJuego()">EMPEZAR DESAFÍO</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header-info">
            <h2 id="user-display"></h2>
            <p>Pregunta: <span id="current-count">0</span> / 12</p>
            <p>Aciertos: <span id="score-display">0</span></p>
        </div>

        <div class="roulette-wrapper">
            <canvas id="canvas" width="400" height="400"></canvas>
        </div>
        
        <button id="spin-btn">GIRAR RULETA</button>

        <div id="quiz-area" class="hidden">
            <div class="quiz-card">
                <h2 id="categoria-display"></h2>
                <p id="pregunta-text"></p>
                <div id="opciones-container"></div>
                <div id="feedback" class="feedback"></div>
            </div>
        </div>

        <div id="results-screen" class="hidden">
            <div class="quiz-card">
                <h2>Resultados finales</h2>
                <p id="final-summary"></p>
                <div id="per-topic-stats"></div>
                <button onclick="reiniciarJuego()" class="btn-main">Jugar de nuevo</button>
            </div>
        </div>
        
        <div id="history-screen" class="hidden">
            <div class="quiz-card">
                <h2>Historial de partidas</h2>
                <div id="history-list">Cargando...</div>
                <button onclick="cerrarHistorial()" class="btn-main">Cerrar historial</button>
            </div>
        </div>

        <div id="ranking-screen" class="hidden">
            <div class="quiz-card">
                <h2>Ranking - Mejores jugadores</h2>
                <div id="ranking-list">Cargando...</div>
                <button onclick="cerrarRanking()" class="btn-main">Cerrar ranking</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
